name: Quick Intel macOS beta

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Build, smoke check, and package
        run: bash scripts/build_macos_fast.sh
      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: CopyFinder-macOS-0.1.0-beta.1
          path: dist/macos/
          if-no-files-found: error
          retention-days: 7
